name: SafeMask Auto-Build (Web PWA + Auto-SEO + Android APK)

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: write
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build_and_apk:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js 22
        uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      - name: Run QA test suite
        run: npm test

      - name: Generate Auto-SEO & Build Web PWA + Landing Page
        run: npm run build

      - name: Setup Java 21 for Android APK build
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '21'

      - name: Sync Capacitor Android & Build APK (Free GitHub Runner)
        run: |
          npx cap sync android
          cd android
          chmod +x gradlew
          ./gradlew assembleDebug
          mkdir -p ../dist/downloads
          cp app/build/outputs/apk/debug/app-debug.apk ../dist/downloads/safemask-latest.apk

      - name: Upload Android APK artifact
        uses: actions/upload-artifact@v4
        with:
          name: safemask-android-apk
          path: dist/downloads/safemask-latest.apk

      - name: Setup GitHub Pages
        uses: actions/configure-pages@v5

      - name: Upload Pages bundle (Web PWA + Auto-SEO + Direct APK)
        uses: actions/upload-pages-artifact@v3
        with:
          path: dist

  deploy_pages:
    needs: build_and_apk
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy to GitHub Pages (safemask.tuandigital.vn)
        id: deployment
        uses: actions/deploy-pages@v4
